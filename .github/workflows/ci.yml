name: Phase 2 CI

on:
  push:
    branches:
      - main
      - phase2/model-quality
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-container:
    name: Pytest and Docker smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python 3.12.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-serve.lock.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Run Pytest
        run: python -m pytest tests -q

      - name: Generate the synthetic CI bundle
        run: python -m scripts.prepare_ci_bundle

      - name: Build the serving image
        run: docker build --tag bus-travel-time:ci .

      - name: Check readiness and prediction over HTTP
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run --detach --publish 127.0.0.1::8000 bus-travel-time:ci)
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then docker logs "$container" || true; fi
            docker rm --force "$container" >/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [ "$health" = healthy ]; then break; fi
            if [ "$health" = unhealthy ]; then exit 1; fi
            sleep 2
          done
          if [ "$health" != healthy ]; then
            echo "Container did not become ready before the timeout." >&2
            exit 1
          fi

          address=$(docker port "$container" 8000/tcp)
          python -m scripts.smoke_api --base-url "http://$address" \
            --expected-minutes 6.25 --model-version 1
