name: Phase 2 CI

on:
  push:
    branches:
      - main
      - phase2/model-quality
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-container:
    name: Pytest and Docker smoke test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.14'
          # Security-only 3.12 releases have no Windows installer in setup-python.
          - os: windows-2025
            python: '3.12.10'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pinned platform Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-dev.lock.txt
            requirements-serve.lock.txt

      - name: Create an isolated CI environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          environment = Path(os.environ['RUNNER_TEMP']) / 'phase2-venv'
          subprocess.run([sys.executable, '-m', 'venv', str(environment)], check=True)
          binaries = environment / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as stream:
              print(binaries, file=stream)

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Verify the complete test environment lock
        run: python -m scripts.verify_environment --require-venv

      - name: Run Pytest
        run: python -m pytest tests -q --basetemp="${{ runner.temp }}/p2-tests"

      - name: Generate the synthetic CI bundle
        if: runner.os == 'Linux'
        run: python -m scripts.prepare_ci_bundle

      - name: Build the serving image
        if: runner.os == 'Linux'
        run: docker build --tag bus-travel-time:ci .

      - name: Check readiness and prediction over HTTP
        if: runner.os == 'Linux'
        run: bash scripts/smoke_container.sh bus-travel-time:ci 1 6.25
