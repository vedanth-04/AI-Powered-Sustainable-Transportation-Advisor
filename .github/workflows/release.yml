name: Phase 2 Approved Model Release

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: Approved model version with a checked-in release approval
        required: true
        default: '1'
        type: string
  push:
    tags:
      - phase2-image-v1

permissions:
  contents: read

concurrency:
  group: phase2-approved-model-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Verify approved bundle and publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      version: ${{ steps.policy.outputs.version }}
      expected_minutes: ${{ steps.policy.outputs.expected_minutes }}

    steps:
      - name: Check out authorized release revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select and authorize approved release
        id: policy
        env:
          REQUESTED_VERSION: ${{ inputs.model_version || '1' }}
        run: |
          git fetch origin main
          python3 -m scripts.release_policy authorize --model-version "$REQUESTED_VERSION"

      - name: Set up release verification Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.14'

      - name: Isolate release verification dependencies
        run: |
          python -m venv "$RUNNER_TEMP/release-venv"
          echo "$RUNNER_TEMP/release-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install -r requirements-ci.txt
          "$RUNNER_TEMP/release-venv/bin/python" -m pip check

      - name: Require successful main CI on the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          passed=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f status=success \
            --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main" and .event == "push") | .head_sha')
          if ! grep -Fxq "$GITHUB_SHA" <<< "$passed"; then
            echo 'Phase 2 CI must pass on the exact commit before release.' >&2
            exit 1
          fi

      - name: Restore the frozen approved v1 bundle
        if: steps.policy.outputs.version == '1'
        env:
          PHASE2_MODEL_V1_PART_1: ${{ secrets.PHASE2_MODEL_V1_PART_1 }}
          PHASE2_MODEL_V1_PART_2: ${{ secrets.PHASE2_MODEL_V1_PART_2 }}
        run: python3 -m scripts.release_bundle stage

      - name: Restore a separately approved versioned handoff
        if: steps.policy.outputs.version != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_RUN_ID: ${{ steps.policy.outputs.artifact_run_id }}
          ARTIFACT_NAME: ${{ steps.policy.outputs.artifact_name }}
          MODEL_VERSION: ${{ steps.policy.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPROVAL_RUN_ID" > "$RUNNER_TEMP/producer.json"
          python -m scripts.release_policy producer --model-version "$MODEL_VERSION" --producer-json "$RUNNER_TEMP/producer.json"
          gh run download "$APPROVAL_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir outputs/phase2_serving

      - name: Verify approval, provenance and executable bundle
        env:
          MODEL_VERSION: ${{ steps.policy.outputs.version }}
        run: python -m scripts.release_policy verify --model-version "$MODEL_VERSION"

      - name: Recheck shared registry approval for new versions
        if: steps.policy.outputs.version != '1'
        env:
          MODEL_VERSION: ${{ steps.policy.outputs.version }}
          PHASE2_MLFLOW_TRACKING_URI: ${{ secrets.PHASE2_MLFLOW_TRACKING_URI }}
          PHASE2_MLFLOW_REGISTRY_URI: ${{ secrets.PHASE2_MLFLOW_REGISTRY_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          MLFLOW_TRACKING_TOKEN: ${{ secrets.MLFLOW_TRACKING_TOKEN }}
        run: python -m scripts.release_policy registry --model-version "$MODEL_VERSION"

      - name: Build the approved model image
        env:
          MODEL_VERSION: ${{ steps.policy.outputs.version }}
        run: |
          docker build --platform linux/amd64 --tag bus-travel-time:release \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$MODEL_VERSION" .

      - name: Smoke-test the approved model over HTTP
        env:
          MODEL_VERSION: ${{ steps.policy.outputs.version }}
          EXPECTED_MINUTES: ${{ steps.policy.outputs.expected_minutes }}
        run: bash scripts/smoke_container.sh bus-travel-time:release "$MODEL_VERSION" "$EXPECTED_MINUTES"

      - name: Publish the tested image to GHCR
        id: publish
        env:
          GHCR_TOKEN: ${{ github.token }}
          MODEL_VERSION: ${{ steps.policy.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/bus-travel-time"
          ref="$image:v$MODEL_VERSION"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag bus-travel-time:release "$ref"
          push_output=$(docker push "$ref")
          printf '%s\n' "$push_output"
          digest=$(sed -nE 's/^v[0-9]+: digest: (sha256:[0-9a-f]{64}) .*$/\1/p' <<< "$push_output")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Docker did not report a valid published digest.' >&2
            exit 1
          fi
          docker tag bus-travel-time:release "$image:sha-$GITHUB_SHA-v$MODEL_VERSION"
          docker push "$image:sha-$GITHUB_SHA-v$MODEL_VERSION"
          printf 'image_ref=%s@%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"

  verify-published:
    name: Verify the published image by digest
    needs: build-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out smoke-test script
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Pull the published image by digest
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ needs.build-and-publish.outputs.image_ref }}
          MODEL_VERSION: ${{ needs.build-and-publish.outputs.version }}
          EXPECTED_MINUTES: ${{ needs.build-and-publish.outputs.expected_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE_REF"

      - name: Smoke-test published digest
        env:
          IMAGE_REF: ${{ needs.build-and-publish.outputs.image_ref }}
          MODEL_VERSION: ${{ needs.build-and-publish.outputs.version }}
          EXPECTED_MINUTES: ${{ needs.build-and-publish.outputs.expected_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/smoke_container.sh "$IMAGE_REF" "$MODEL_VERSION" "$EXPECTED_MINUTES"
          {
            printf '## Phase 2 release v%s\n\n' "$MODEL_VERSION"
            printf -- '- Image: `%s`\n' "$IMAGE_REF"
            printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Model: `BusTravelTimePredictor` v%s, historical Route 90 demo\n' "$MODEL_VERSION"
            printf -- '- Pulled and verified readiness, approved prediction, and HTTP 422 for an unsupported route.\n'
          } >> "$GITHUB_STEP_SUMMARY"
