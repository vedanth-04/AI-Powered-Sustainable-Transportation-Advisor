name: Phase 2 Model v1 Release

on:
  push:
    tags:
      - phase2-image-v1

permissions:
  contents: read

concurrency:
  group: phase2-image-v1
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Verify approved bundle and publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}

    steps:
      - name: Check out tagged code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Require a successful CI run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          passed=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f status=success \
            --jq '.workflow_runs[] | select(.conclusion == "success") | .head_sha')
          if ! grep -Fxq "$GITHUB_SHA" <<< "$passed"; then
            echo 'Phase 2 CI must pass on the exact commit before release.' >&2
            exit 1
          fi

      - name: Restore and verify the approved v1 bundle
        env:
          PHASE2_MODEL_V1_PART_1: ${{ secrets.PHASE2_MODEL_V1_PART_1 }}
          PHASE2_MODEL_V1_PART_2: ${{ secrets.PHASE2_MODEL_V1_PART_2 }}
        run: python3 -m scripts.release_bundle stage

      - name: Build the model v1 image
        run: |
          docker build --platform linux/amd64 --tag bus-travel-time:release-v1 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label 'org.opencontainers.image.version=1' .

      - name: Smoke-test the approved model over HTTP
        run: bash scripts/smoke_container.sh bus-travel-time:release-v1 1 6.320402254818158

      - name: Publish the tested image to GHCR
        id: publish
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/bus-travel-time"
          ref="$image:v1"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag bus-travel-time:release-v1 "$ref"
          push_output=$(docker push "$ref")
          printf '%s\n' "$push_output"
          digest=$(sed -nE 's/^v1: digest: (sha256:[0-9a-f]{64}) .*$/\1/p' <<< "$push_output")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Docker did not report a valid published digest.' >&2
            exit 1
          fi
          printf 'image_ref=%s@%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"

  verify-published:
    name: Verify the published image by digest
    needs: build-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out smoke-test script
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Pull the published image by digest
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ needs.build-and-publish.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE_REF"

      - name: Smoke-test ${{ needs.build-and-publish.outputs.image_ref }}
        env:
          IMAGE_REF: ${{ needs.build-and-publish.outputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/smoke_container.sh "$IMAGE_REF" 1 6.320402254818158
          {
            printf '## Phase 2 release v1\n\n'
            printf -- '- Image: `%s`\n' "$IMAGE_REF"
            printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Model: `BusTravelTimePredictor` v1, historical Route 90 demo\n'
            printf -- '- Pulled and verified readiness, 6.320402254818158-minute prediction, and HTTP 422 for an unsupported route.\n'
          } >> "$GITHUB_STEP_SUMMARY"
